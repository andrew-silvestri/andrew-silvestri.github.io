<!DOCTYPE html>
<html lang="en">

<style>
:root{--bg:#0f1419;--panel:#1a2129;--ink:#e8e6e3;--dim:#8b949e;--acc:#e8a33d;--blue:#4c9fd0;--green:#55a868;--red:#c44e52;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,sans-serif;padding-bottom:60px}
header{padding:22px 28px;border-bottom:1px solid #2a3038}
header h1{font-size:20px;color:var(--acc)} header p{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;padding:10px 24px;border-bottom:1px solid #2a3038;flex-wrap:wrap}
nav button{background:none;border:1px solid #2a3038;color:var(--dim);padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
main{padding:20px 28px;max-width:1250px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.card{background:var(--panel);border:1px solid #2a3038;border-radius:8px;padding:14px}
.card b{font-size:22px;color:var(--acc);display:block}.card span{color:var(--dim);font-size:12px}
h2{font-size:16px;margin:18px 0 8px;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid #232a33;vertical-align:top}
th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--bg)}
tr:hover td{background:#1e2630}
input[type=text]{background:var(--panel);border:1px solid #2a3038;color:var(--ink);padding:8px 12px;border-radius:6px;width:340px;font-size:13px}
select{background:var(--panel);border:1px solid #2a3038;color:var(--ink);padding:8px;border-radius:6px}
.detail{background:var(--panel);border:1px solid #2a3038;border-radius:8px;padding:16px;margin:10px 0}
.pill{display:inline-block;border:1px solid #2a3038;border-radius:10px;padding:1px 9px;margin:1px;font-size:11px;color:var(--dim)}
.lev-Foundational{color:#e8a33d}.lev-Very.high{color:#c44e52}
.hot{color:var(--red)}.cool{color:var(--green)}
small{color:var(--dim)}
.bar{height:9px;background:#2a3038;border-radius:5px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--acc)}
</style>
