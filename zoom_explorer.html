<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From the Sun to the Mind — a dive through the energy web</title>

<meta name="theme-color" content="#070a12">

<style>
:root{--bg:#070a10;--ink:#e8e6e3;--dim:#8b949e;--acc:#e8a33d;--panel:#10151dd9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,sans-serif;overflow:hidden}
canvas{display:block;cursor:grab}
#hud{position:fixed;top:14px;left:16px;max-width:300px;pointer-events:none;z-index:3}
#hud h1{font-size:17px;color:var(--acc)}
#hud p{font-size:12px;color:var(--dim)}
#levelname{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3;
  font-size:15px;color:var(--acc);letter-spacing:.14em;text-transform:uppercase;text-align:center}
#levelname small{display:block;color:var(--dim);letter-spacing:.02em;text-transform:none;font-size:12px}
#panel{position:fixed;right:0;top:0;bottom:0;width:340px;background:var(--panel);
  backdrop-filter:blur(10px);border-left:1px solid #2a3038;padding:18px;overflow-y:auto;
  transform:translateX(100%);transition:transform .25s;z-index:4}
#panel.open{transform:none}
#panel h2{font-size:15px;color:var(--acc);margin-bottom:2px}
#panel .kind{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
#panel p{font-size:13.5px;margin:10px 0;color:#cfcbc4;line-height:1.6}
#panel label{font-size:12px;color:var(--dim)}
input[type=range]{width:100%}
button{background:var(--acc);color:#111;border:0;padding:8px 14px;border-radius:6px;
  font-weight:600;cursor:pointer;margin:6px 6px 0 0}
button.ghost{background:none;border:1px solid #2a3038;color:var(--dim)}
select{background:#161d27;color:var(--ink);border:1px solid #2a3038;border-radius:6px;
  padding:7px;width:100%;margin:6px 0}
#controls{position:fixed;bottom:16px;left:16px;background:var(--panel);z-index:3;
  border:1px solid #2a3038;border-radius:8px;padding:12px;width:308px;backdrop-filter:blur(10px)}
#controls .lvl{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
#controls .lvl button{font-size:10.5px;padding:5px 7px;margin:0;background:none;
  border:1px solid #2a3038;color:var(--dim)}
#controls .lvl button.on{background:var(--acc);color:#111;border-color:var(--acc)}
#status{position:fixed;bottom:16px;right:16px;font-size:12px;color:var(--dim);z-index:3;
  background:var(--panel);padding:6px 12px;border-radius:6px;border:1px solid #2a3038}
#scdesc{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.45}
</style>
<style id="site-palette">

:root{

  --blue:#5aa8d8; --green:#4f9d84; --red:#d86a86;
  --sea:#070c18; --land:#10192c; --accent:#8b7ff2;
  --station:#8b7ff2; --event:#d86a86; --grid:#5aa8d8; --supply:#6f7fd8;
  --district:#5c6a8c; --consumer:#8b93b0; --market:#cfd6f0;

@media (prefers-color-scheme: light){
  :root{
    --ink:#161a26; --dim:#5c6480; --faint:#e0e3ef; --bg:#f4f5fa;

}
</style>

Be records", "res": 0.4000000059604645}, {"i": 681, "level": 1, "kind": "driver", "name": "[01:4] Solar UV spectral variability", "desc": "Disproportionate UV change alters stratospheric ozone/heating, shifts jet and NAO regionally \u2014 leverage Low, timescale 11 yr. Metric: SORCE SOLSTICE spectra", "res": 0.4000000059604645}, {"i": 682, "level": 1, "kind": "driver", "name": "[01:5] Solar wind / heliospheric modulation", "desc": "Modulates galactic cosmic ray flux reaching troposphere \u2014 leverage Very low, timescale Days-decades. Metric: Neutron monitor counts", "res": 0.15000000596046448}, {"i": 683, "level": 1, "kind": "driver", "name": "[01:6] Galactic cosmic ray flux (Svensmark hypothesis)", "desc": "Proposed ion-induced nucleation of cloud condensation nuclei; CLOUD experiment finds effect too weak \u2014 leverage Negligible, timescale Decades. Metric: CERN CLOUD, CR neutron data", "res": 0.6499999761581421}, {"i": 684, "level": 1, "kind": "driver", "name": "[01:7] Coronal mass ejections / geomagnetic storms", "desc": "Induce GICs, can trip transformers and force grid load-shedding or blackout \u2014 leverage Low but tail-risk, timescale Hours. Metric: Dst index, NOAA SWPC alerts", "res": 0.10000000149011612}, {"i": 685, "level": 1, "kind": "driver", "name": "[01:8] Solar flare X-ray events", "desc": "Disrupt HF comms, GPS timing used in grid PMU synchronization \u2014 leverage Low, timescale Minutes-hours. Metric: GOES XRS flux", "res": 0.10000000149011612}, {"i": 686, "level": 1, "kind": "driver", "name": "[01:9] Earth orbital eccentricity (~100 kyr)", "desc": "Modulates annual insolation total and seasonal contrast; pacemaker of glacial cycles \u2014 leverage Foundational, timescale 100 kyr. Metric: Berger-Loutre orbital solutions", "res": 0.4000000059604645}, {"i": 687, "level": 1, "kind": "driver", "name": "[01:10] Axial obliquity (~41 kyr)", "desc": "Controls high-latitude summer insolation, governs ice sheet growth/decay \u2014 leverage Foundational, timescale 41 kyr. Metric: Laskar 2004 ephemerides", "res": 0.4000000059604645}, {"i": 688, "level": 1, "kind": "driver", "name": "[01:11] Precession of the equinoxes (~23 kyr)", "desc": "Shifts seasonal timing of perihelion, redistributes insolation by hemisphere \u2014 leverage Foundational, timescale 23 kyr. Metric: Laskar 2004", "res": 0.4000000059604645}, {"i": 689, "level": 1, "kind": "driver", "name": "[01:12] Milankovitch phase relative to today", "desc": "We sit near an insolation configuration that would otherwise slowly cool NH summers \u2014 leverage Foundational, timescale 10 kyr. Metric: Insolation at 65N June", "res": 0.4000000059604645}, {"i": 690, "level": 1, "kind": "driver", "name": "[01:13] Earth-Sun distance seasonal cycle", "desc": "3.4% irradiance swing perihelion-aphelion, sets hemispheric asymmetry in seasonal energy \u2014 leverage Low, timescale Annual. Metric: Ephemeris", "res": 0.4000000059604645}, {"i": 691, "level": 1, "kind": "driver", "name": "[01:14] Lunar tidal forcing / 18.6 yr nodal cycle", "desc": "Modulates tidal mixing, sea level extremes, and tidal energy resource availability \u2014 leverage Very low, timescale 18.6 yr. Metric: Tide gauge harmonics", "res": 0.4000000059604645}, {"i": 692, "level": 1, "kind": "driver", "name": "[01:15] Length-of-day / Earth rotation variation", "desc": "Weakly couples to atmospheric angular momentum and circulation indices \u2014 leverage Negligible, timescale Years. Metric: IERS EOP series", "res": 0.44999998807907104}, {"i": 693, "level": 1, "kind": "driver", "name": "[01:16] Geomagnetic field strength / excursions", "desc": "Modulates cosmic ray shielding and satellite/grid vulnerability \u2014 leverage Very low, timescale kyr. Metric: Paleomagnetic records", "res": 0.4000000059604645}, {"i": 694, "level": 1, "kind": "driver", "name": "[01:17] Bolide / asteroid impact", "desc": "Injects dust and sulfate, causes impact winter, collapses agricultural energy systems \u2014 leverage Catastrophic tail, timescale Instant. Metric: NEO survey (CNEOS)", "res": 0.07999999821186066}, {"i": 695, "level": 1, "kind": "driver", "name": "[01:18] Interstellar dust cloud passage", "desc": "Speculative attenuation of insolation on Myr timescales \u2014 leverage Negligible, timescale Myr. Metric: Astrophysical modeling", "res": 0.4000000059604645}, {"i": 696, "level": 1, "kind": "driver", "name": "[01:19] Supernova proximity", "desc": "Ozone destruction via cosmic rays and gamma flux; deep tail risk \u2014 leverage Negligible, timescale Myr. Metric: 60Fe seabed anomalies", "res": 0.4000000059604645}, {"i": 697, "level": 1, "kind": "driver", "name": "[01:20] Space-based solar power feasibility", "desc": "Would move collection above weather/night, enormous launch energy debt \u2014 leverage Speculative, timescale Decades. Metric: Launch cost $/kg, JAXA/ESA studies", "res": 0.6499999761581421}, {"i": 698, "level": 1, "kind": "driver", "name": "[01:21] Satellite constellation launch emissions", "desc": "Rocket black carbon injected into stratosphere has outsized per-kg forcing \u2014 leverage Low but growing, timescale Years. Metric: Launch cadence, BC injection studies", "res": 0.44999998807907104}, {"i": 699, "level": 1, "kind": "driver", "name": "[01:22] Orbital debris / Kessler risk", "desc": "Loss of Earth observation degrades climate monitoring and precision agriculture energy savings \u2014 leverage Low, timescale Decades. Metric: ESA Space Environment Report", "res": 0.6499999761581421}, {"i": 700, "level": 1, "kind": "driver", "name": "[01:23] Solar geoengineering platform capability", "desc": "Aircraft/balloon lofting capacity constrains SRM deployment feasibility \u2014 leverage High if deployed, timescale Years. Metric: SCoPEx-class studies, DECIMALS", "res": 0.44999998807907104}, {"i": 701, "level": 1, "kind": "driver", "name": "[01:24] Cosmic microwave background / deep space sink", "desc": "2.7 K sink temperature sets the ultimate Carnot ceiling for radiative cooling technologies \u2014 leverage Foundational, timescale Constant. Metric: Radiative sky cooling literature", "res": 0.4000000059604645}, {"i": 702, "level": 1, "kind": "driver", "name": "[01:25] Radiative sky cooling window (8-13 um)", "desc": "Atmospheric IR window enables passive daytime cooling without electricity \u2014 leverage Medium, timescale Now. Metric: Emissivity spectra, Raman/Fan group work", "res": 0.4000000059604645}, {"i": 703, "level": 6, "kind": "driver", "name": "[06:1] Hyperbolic discounting", "desc": "Steep near-term discounting causes rejection of efficiency investments with 2-3 yr paybacks \u2014 leverage Very high, timescale Instant. Metric: Behavioral econ experiments", "res": 0.07999999821186066}, {"i": 704, "level": 6, "kind": "driver", "name": "[06:2] Implicit discount rates for appliances", "desc": "Households behave as if discounting at 20-100%/yr, far above capital cost \u2014 leverage Very high, timescale Purchase decision. Metric: Hausman 1979, energy paradox literature", "res": 0.30000001192092896}, {"i": 705, "level": 6, "kind": "driver", "name": "[06:3] Status quo bias / default effect", "desc": "People stay with defaults; green default tariffs raise renewable uptake 10x \u2014 leverage Very high, timescale Instant. Metric: Ebeling & Lotz 2015", "res": 0.07999999821186066}, {"i": 706, "level": 6, "kind": "driver", "name": "[06:4] Loss aversion (Kahneman-Tversky)", "desc": "Losses weigh ~2x gains; framing efficiency as avoided loss outperforms gain framing \u2014 leverage High, timescale Instant. Metric: Prospect theory", "res": 0.07999999821186066}, {"i": 707, "level": 6, "kind": "driver", "name": "[06:5] Endowment effect", "desc": "Owning a car or gas stove raises its perceived value, resisting substitution \u2014 leverage Medium, timescale Persistent. Metric: Thaler 1980", "res": 0.4000000059604645}, {"i": 708, "level": 6, "kind": "driver", "name": "[06:6] Cognitive dissonance reduction", "desc": "After a high-carbon choice, people revise beliefs to justify it rather than change behavior \u2014 leverage High, timescale Days. Metric: Festinger; moral licensing studies", "res": 0.15000000596046448}, {"i": 709, "level": 6, "kind": "driver", "name": "[06:7] Moral licensing", "desc": "A green act (recycling, donating) licenses a subsequent high-carbon indulgence \u2014 leverage Medium, timescale Days. Metric: Mazar & Zhong 2010", "res": 0.15000000596046448}, {"i": 710, "level": 6, "kind": "driver", "name": "[06:8] Single-action bias", "desc": "Taking one visible mitigation step reduces motivation for further, larger ones \u2014 leverage Medium, timescale Months. Metric: Weber 2006", "res": 0.30000001192092896}, {"i": 711, "level": 6, "kind": "driver", "name": "[06:9] Finite pool of worry", "desc": "Attention to climate crowds out when economic or health worries rise \u2014 leverage High, timescale Months. Metric: Weber, risk perception research", "res": 0.30000001192092896}, {"i": 712, "level": 6, "kind": "driver", "name": "[06:10] Psychological distance of climate risk", "desc": "Perceived as temporally, spatially, and socially distant, muting urgency \u2014 leverage High, timescale Persistent. Metric: Construal level theory (Trope & Liberman)", "res": 0.4000000059604645}, {"i": 713, "level": 6, "kind": "driver", "name": "[06:11] Construal level (abstract vs concrete)", "desc": "Abstract framings reduce action; concrete local impacts increase it \u2014 leverage Medium, timescale Instant. Metric: CLT experiments", "res": 0.07999999821186066}, {"i": 714, "level": 6, "kind": "driver", "name": "[06:12] Availability heuristic", "desc": "Recent disasters spike concern and policy support temporarily \u2014 leverage Medium, timescale Months. Metric: Tversky & Kahneman", "res": 0.30000001192092896}, {"i": 715, "level": 6, "kind": "driver", "name": "[06:13] Affect heuristic", "desc": "Emotional valence toward nuclear or wind dominates numerical risk information \u2014 leverage High, timescale Instant. Metric: Slovic 2007", "res": 0.07999999821186066}, {"i": 716, "level": 6, "kind": "driver", "name": "[06:14] Anchoring on prior energy bills", "desc": "Bill history anchors perceived normal use, damping response to price change \u2014 leverage Medium, timescale Monthly. Metric: Behavioral utility trials", "res": 0.30000001192092896}, {"i": 717, "level": 6, "kind": "driver", "name": "[06:15] Mental accounting", "desc": "Fuel budget treated separately from vehicle purchase, breaking lifecycle optimization \u2014 leverage High, timescale Persistent. Metric: Thaler 1985", "res": 0.4000000059604645}, {"i": 718, "level": 6, "kind": "driver", "name": "[06:16] Bounded rationality / satisficing", "desc": "People pick first acceptable option, not optimal; explains persistence of inefficient equipment \u2014 leverage Very high, timescale Instant. Metric: Simon 1955", "res": 0.07999999821186066}, {"i": 719, "level": 6, "kind": "driver", "name": "[06:17] Attention as a scarce resource", "desc": "Energy is invisible and low-salience; attention scarcity is the core barrier \u2014 leverage Very high, timescale Persistent. Metric: Attention economics literature", "res": 0.4000000059604645}, {"i": 720, "level": 6, "kind": "driver", "name": "[06:18] Salience and feedback latency", "desc": "Monthly bills give delayed, aggregated feedback; real-time displays cut use 3-12% \u2014 leverage High, timescale Real-time. Metric: Darby 2006, IHD trials", "res": 0.4000000059604645}, {"i": 721, "level": 6, "kind": "driver", "name": "[06:19] Habit formation and automaticity", "desc": "Most energy behavior is habitual, bypassing deliberate choice entirely \u2014 leverage Very high, timescale Months. Metric: Wood & Neal habit research", "res": 0.30000001192092896}, {"i": 722, "level": 6, "kind": "driver", "name": "[06:20] Habit discontinuity (moving, job change)", "desc": "Life disruptions open windows where behavior change actually sticks \u2014 leverage High, timescale Weeks. Metric: Verpla  psych_hub:"#e8a33d",driver:"#4c9fd0",tax_hub:"#e8a33d"};
// ---- lay each layer out on its plane: kind-clustered golden-spiral disc
const nodes=D.nodes;
{
  const byL={};nodes.forEach(n=>(byL[n.level]=byL[n.level]||[]).push(n));
  for(const l in byL){
    const arr=byL[l];arr.sort((a,b)=>a.kind<b.kind?-1:1);
    const R=170+34*Math.sqrt(arr.length);
    arr.forEach((n,k)=>{
      const r=R*Math.sqrt((k+3)/(arr.length+3)),a=k*2.39996;
      n.x=r*Math.cos(a);n.y=r*Math.sin(a);n.z=LZ(+l);
    });
  }
}
// ---- engine (same tanh dynamics as the Python Engine4)
const N=nodes.length,res=Float64Array.from(nodes.map(n=>n.res));
const ES=D.edges.map(e=>e.s),ET=D.edges.map(e=>e.t),EW=D.edges.map(e=>e.w);
let frames=[],firstHit=null,frameIdx=-1,shocks={};
function propagate(sh){
  const b=new Float64Array(N);for(const k in sh)b[k]=sh[k];
  let s=Float64Array.from(b);const out=[Float64Array.from(s)],lam=0.55;
  const fh=new Int16Array(N).fill(-1);
  for(let i=0;i<N;i++)if(Math.abs(s[i])>=0.02)fh[i]=0;
  for(let r=1;r<=40;r++){
    const inf=new Float64Array(N);
    for(let e=0;e<ES.length;e++)inf[ET[e]]+=EW[e]*s[ES[e]];
    const sn=new Float64Array(N);let mx=0;
    for(let i=0;i<N;i++){sn[i]=(1-lam)*s[i]+lam*Math.tanh(b[i]+(1-res[i])*inf[i]);
      if(fh[i]<0&&Math.abs(sn[i])>=0.02)fh[i]=r;mx=Math.max(mx,Math.abs(sn[i]-s[i]));}
    s=sn;out.push(Float64Array.from(s));if(mx<1e-4)break;
  }
  return[out,fh];
}
// ---- camera: z-dive with perspective; start pulled back to see the whole column
let cz=-2600,px=0,py=0,drag=null,targetCz=null;
function proj(n){const d=n.z-cz;if(d<60)return null;
  const s=F/d;return[W/2+px+(n.x)*s,H/2+py+(n.y)*s+ (n.z-LZ(3))*0.06*s, s];}
cv.addEventListener("wheel",e=>{e.preventDefault();
  cz+=e.deltaY<0?150:-150;cz=Math.max(-3000,Math.min(LZ(NL-1)-260,cz));
  targetCz=null;draw();},{passive:false});
cv.addEventListener("mousedown",e=>drag=[e.clientX,e.clientY]);
addEventListener("mousemove",e=>{if(drag){px+=e.clientX-drag[0];py+=e.clientY-drag[1];
  drag=[e.clientX,e.clientY];draw();}});
addEventListener("mouseup",()=>drag=null);
function flyTo(z){targetCz=z;
  const iv=setInterval(()=>{cz+=(targetCz-cz)*0.16;draw();
    if(Math.abs(targetCz-cz)<4){cz=targetCz;clearInterval(iv);draw();}},16);}
// ---- procedural backdrops per layer (the scenery)
const stars=Array.from({length:260},(_, i)=>({x:(Math.sin(i*97.3)*0.5+0.5)*2400-1200,
  y:(Math.sin(i*57.7)*0.5+0.5)*2400-1200,r:0.6+1.6*(Math.sin(i*13.1)*0.5+0.5)}));
function backdrop(l,s,alpha){
  cx.save();cx.globalAlpha=alpha;cx.translate(W/2+px,H/2+py);cx.scale(s,s);
  if(l===0){ // sun + corona + stars
    for(const st of stars){cx.beginPath();cx.arc(st.x,st.y,st.r/s,0,7);
      cx.fillStyle="rgba(220,225,235,0.5)";cx.fill();}
    const g=cx.createRadialGradient(0,0,10,0,0,320);
    g.addColorStop(0,"rgba(255,230,150,0.95)");g.addColorStop(0.3,"rgba(232,163,61,0.5)");
    g.addColorStop(1,"rgba(232,163,61,0)");cx.fillStyle=g;
    cx.beginPath();cx.arc(0,0,320,0,7);cx.fill();
  }else if(l===1){ // earth: blue sphere, latitude bands, cloud arcs
    const g=cx.createRadialGradient(-80,-80,40,0,0,430);
    g.addColorStop(0,"#2a6fa8");g.addColorStop(0.75,"#123a5e");g.addColorStop(1,"rgba(10,25,45,0)");
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,430,0,7);cx.fill();
    cx.strokeStyle="rgba(190,220,240,0.20)";cx.lineWidth=9;
    for(let k=-2;k<=2;k++){cx.beginPath();cx.ellipse(0,k*120,400,52,0,0,7);cx.stroke();}
  }else if(l===2){ // world map: rough continents + shipping lanes
    cx.fillStyle="rgba(90,110,90,0.30)";
    const blobs=[[-340,-90,150,90],[-120,40,90,120],[60,-110,190,90],[150,40,120,80],
                 [320,110,90,60],[-40,-190,80,40],[260,-40,70,50]];
    for(const[bx,by,rw,rh]of blobs){cx.beginPath();cx.ellipse(bx,by,rw,rh,0.3,0,7);cx.fill();}
    cx.strokeStyle="rgba(232,163,61,0.28)";cx.setLineDash([10,12]);cx.lineWidth=3;
    for(const[a,b]of[[[-340,-60],[60,-90]],[[100,-60],[320,90]],[[-100,90],[280,110]]]){
      cx.beginPath();cx.moveTo(a[0],a[1]);cx.quadraticCurveTo((a[0]+b[0])/2,(a[1]+b[1])/2+90,b[0],b[1]);cx.stroke();}
    cx.setLineDash([]);
  }else if(l===3){ // transmission net
    cx.strokeStyle="rgba(85,168,104,0.22)";cx.lineWidth=3;
    for(let k=0;k<14;k++){const a=k*0.449;cx.beginPath();cx.moveTo(0,0);
      cx.lineTo(560*Math.cos(a),560*Math.sin(a));cx.stroke();}
    cx.strokeStyle="rgba(85,168,104,0.16)";
    for(const r of[170,320,470]){cx.beginPath();cx.arc(0,0,r,0,7);cx.stroke();}
  }else if(l===4){ // Texas silhouette (rough)
    cx.fillStyle="rgba(196,78,82,0.16)";cx.strokeStyle="rgba(196,78,82,0.45)";cx.lineWidth=5;
    cx.beginPath();
    const tx=[[-250,-260],[30,-260],[30,-140],[210,-90],[260,40],[140,120],[90,300],
              [10,210],[-140,120],[-190,90],[-250,-40]];
    cx.moveTo(tx[0][0],tx[0][1]);for(const p of tx)cx.lineTo(p[0],p[1]);
    cx.closePath();cx.fill();cx.stroke();
  }else if(l===5){ // street grid
    cx.strokeStyle="rgba(150,160,170,0.16)";cx.lineWidth=6;
    for(let k=-4;k<=4;k++){cx.beginPath();cx.moveTo(k*120,-460);cx.lineTo(k*120,460);cx.stroke();
      cx.beginPath();cx.moveTo(-460,k*120);cx.lineTo(460,k*120);cx.stroke();}
  }else if(l===6){ // brain: two lobes + synapse sparks
    cx.strokeStyle="rgba(204,185,116,0.4)";cx.lineWidth=8;
    cx.beginPath();cx.ellipse(-95,0,190,240,0,0.35*Math.PI,1.75*Math.PI);cx.stroke();
    cx.beginPath();cx.ellipse(95,0,190,240,0,-0.75*Math.PI,0.65*Math.PI);cx.stroke();
    cx.fillStyle="rgba(232,163,61,0.35)";
    for(let k=0;k<26;k++){cx.beginPath();
      cx.arc(Math.sin(k*3.7)*230,Math.cos(k*5.1)*200,5,0,7);cx.fill();}
  }
  cx.restore();
}
// ---- draw
function heat(v){const t=Math.min(Math.abs(v)/0.5,1);
  return v>=0?`rgb(255,${Math.round(190-150*t)},${Math.round(60-50*t)})`
             :`rgb(${Math.round(90+40*t)},200,${Math.round(120+60*t)})`;}
function draw(){
  cx.fillStyle="#070a10";cx.fillRect(0,0,W,H);
  const s=frameIdx>=0?frames[Math.min(frameIdx,frames.length-1)]:null;
  // far -> near
  for(let l=NL-1;l>=0;l--){
    const d=LZ(l)-cz;if(d<60)continue;
    const sc=F/d,alpha=Math.max(0,Math.min(1,(sc-0.10)*4))*Math.max(0.15,Math.min(1,3.2-sc));
    if(alpha<=0.01)continue;
    backdrop(l,sc,alpha*0.9);
  }
  // edges (traces through depth)
  for(let e=0;e<ES.length;e++){
    const a=proj(nodes[ES[e]]),b=proj(nodes[ET[e]]);
    if(!a||!b)continue;
    let al=0.05*Math.min(a[2],b[2],1.4);
    if(s&&Math.abs(s[ES[e]])>0.03&&Math.abs(s[ET[e]])>0.02)al=0.55;
    if(al<0.015)continue;
    cx.strokeStyle=`rgba(210,190,150,${al})`;cx.lineWidth=0.7;
    cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();
  }
  // nodes far -> near
  const order=[...nodes].sort((a,b)=>b.z-a.z);
  for(const n of order){
    const p=proj(n);if(!p)continue;
    const[x,y,sc]=p;if(x<-60||y<-60||x>W+60||y>H+60||sc<0.08)continue;
    const fade=Math.max(0,Math.min(1,(sc-0.10)*5))*Math.max(0.1,Math.min(1,3.4-sc));
    if(fade<0.03)continue;
    let glow=KC[n.kind]||"#888",boost=1;
    if(s){const v=s[n.i];
      if(Math.abs(v)>=0.02){glow=heat(v);boost=1+2.4*Math.min(Math.abs(v),0.6);}
      else glow="rgba(110,115,120,0.5)";
      if(firstHit&&firstHit[n.i]===frameIdx){
        cx.beginPath();cx.arc(x,y,16*sc*boost+8,0,7);
        cx.strokeStyle="rgba(232,163,61,0.85)";cx.lineWidth=2.5;cx.stroke();}
    }
    cx.globalAlpha=fade;
    // halo
    cx.beginPath();cx.arc(x,y,9*sc*boost+2,0,7);cx.fillStyle=glow;
    cx.globalAlpha=fade*0.35;cx.fill();cx.globalAlpha=fade;
    // glyph
    const fs=Math.max(9,Math.min(34,20*sc*boost));
    cx.font=`${fs}px serif`;cx.textAlign="center";cx.textBaseline="middle";
    cx.fillText(GLYPH[n.kind]||"•",x,y);
    // label
    if(sc>0.75&&(sc>1.4||["sun","chokepoint","market","grid","psych_hub","chain","policy","basin","weather"].includes(n.kind))){
      cx.font=`${Math.min(13,9+3*sc)}px system-ui`;cx.textAlign="left";
      cx.fillStyle="rgba(215,210,200,0.85)";
      cx.fillText(n.name.slice(0,sc>2.2?70:30),x+fs*0.7,y+3);
    }
    if(shocks[n.i]!==undefined){cx.beginPath();cx.arc(x,y,fs*0.8+5,0,7);
      cx.strokeStyle="#fff";cx.lineWidth=1.6;cx.stroke();}
    cx.globalAlpha=1;
  }
  // level readout
  let cur=0,bs=0;
  for(let l=0;l<NL;l++){const sc=F/Math.max(LZ(l)-cz,60);
    const score=1/(Math.abs(Math.log(sc))+0.2);if(score>bs){bs=score;cur=l;}}
  document.getElementById("levelname").innerHTML=
    `layer ${cur+1} / ${NL} — ${D.levels[cur]}<small>${cz<-1200?"(pulled back: the whole column)":""}</small>`;
  document.querySelectorAll("#lvlbtns button").forEach((b,i)=>b.classList.toggle("on",i===cur&&cz>=-1200));
  document.getElementById("status").textContent=
    s?`round ${frameIdx}/${frames.length-1} · ${cnt(s)} of ${N} nodes touched`:
      `${N} nodes · ${ES.length} edges · scroll = dive · drag = pan`;
}
function cnt(s){let c=0;for(let i=0;i<N;i++)if(Math.abs(s[i])>=0.02)c++;return c}
// ---- level buttons + fit
const lb=document.getElementById("lvlbtns");
D.levels.forEach((name,l)=>{const b=document.createElement("button");b.textContent=name;
  b.onclick=()=>{px=py=0;flyTo(LZ(l)-F);};lb.appendChild(b);});
document.getElementById("fit").onclick=()=>{px=py=0;flyTo(-2600);};
// ---- selection panel
let sel=null;
cv.addEventListener("click",e=>{
  let best=null,bd=16;
  for(const n of nodes){const p=proj(n);if(!p)continue;
    const d=Math.hypot(p[0]-e.clientX,p[1]-e.clientY);
    if(d<bd&&p[2]>0.25){bd=d;best=n;}}
  if(best){sel=best;
    document.getElementById("p-kind").textContent=
      `${GLYPH[best.kind]||""} ${best.kind} · ${D.levels[best.level]}`;
    document.getElementById("p-name").textContent=best.name;
    document.getElementById("p-desc").textContent=best.desc||"";
    document.getElementById("p-live").textContent="";
    document.getElementById("panel").classList.add("open");}
});
document.getElementById("p-close").onclick=()=>document.getElementById("panel").classList.remove("open");
document.getElementById("p-mag").oninput=e=>document.getElementById("p-magv").textContent=e.target.value;
document.getElementById("p-shock").onclick=()=>{if(!sel)return;
  shocks[sel.i]=+document.getElementById("p-mag").value;runRipple();};
// ---- presets: the full scenario library
const ps=document.getElementById("preset");
for(const name of Object.keys(D.presets)){
  const o=document.createElement("option");o.value=name;
  o.textContent=`${name.replaceAll("_"," ")}  [${D.presets[name].category}]`;ps.appendChild(o);}
ps.onchange=()=>{const p=D.presets[ps.value];
  document.getElementById("scdesc").textContent=p?p.desc:"";
  if(p){shocks={...p.shocks};runRipple();}};
document.getElementById("run").onclick=runRipple;
document.getElementById("reset").onclick=()=>{shocks={};frames=[];frameIdx=-1;draw();};
function runRipple(){
  if(!Object.keys(shocks).length)return;
  [frames,firstHit]=propagate(shocks);frameIdx=0;
  if(sel)document.getElementById("p-live").textContent="rippling…";
  const iv=setInterval(()=>{frameIdx++;draw();
    if(frameIdx>=frames.length-1){clearInterval(iv);
      if(sel)document.getElementById("p-live").textContent=
        `settled: ${cnt(frames[frames.length-1])} nodes touched across the column`;}},150);
}
draw();
</script>
</body>
