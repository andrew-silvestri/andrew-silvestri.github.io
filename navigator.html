body{background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,sans-serif;padding:0 0 60px}
header{padding:22px 28px;border-bottom:1px solid #2a3038}

.bar{height:10px;background:#2a3038;border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--acc)}
.neg i{background:var(--green)}
.timeline{position:relative;margin:24px 0;padding-left:22px;border-left:2px solid #2a3038}
.tl{margin:0 0 18px;cursor:pointer}
.tl:before{content:"";position:absolute;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:5px}
.tl .yr{color:var(--acc);font-weight:700}
.tl .k{font-size:11px;color:var(--dim);border:1px solid #2a3038;border-radius:10px;padding:1px 8px;margin-left:8px}
.tl p{color:var(--dim);font-size:12.5px;max-width:840px}
.detail{background:var(--panel);border:1px solid #2a3038;border-radius:8px;padding:16px;margin:10px 0}
input[type=text]{background:var(--panel);border:1px solid #2a3038;color:var(--ink);padding:8px 12px;border-radius:6px;width:340px;font-size:13px}
select{background:var(--panel);border:1px solid #2a3038;color:var(--ink);padding:8px;border-radius:6px}
svg text{fill:var(--dim);font-size:10px}
.legend{font-size:12px;color:var(--dim);margin:6px 0}
.pill{display:inline-block;border:1px solid #2a3038;border-radius:10px;padding:2px 10px;margin:2px;font-size:12px;color:var(--dim)}
.hot{color:var(--red)} .cool{color:var(--green)}
small{color:var(--dim)}

// ---------- overview
{
  const t=$("#tab-overview");
  let h=`<div class="cards">`;
  const order=Object.entries(D.census).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="card"><b>${fmt(D.meta.nodes)}</b><span>total nodes</span></div>`;
  h+=`<div class="card"><b>${fmt(D.meta.edges)}</b><span>directed edges</span></div>`;
  for(const [k,v] of order) h+=`<div class="card"><b>${fmt(v)}</b><span>${k} nodes</span></div>`;

  const desc={core:"v3 inherited: 31k real power plants (WRI DB), grids, districts, consumers, markets, basins, chokepoints, pipelines, LNG, weather, sun, policy",

    household:"income-decile households per district (decile-specific elasticity & weather exposure)",
    diet:"heavy-meat → plant diet cohorts, coupled to the grain market",
    transit:"rail-commuter / bus / air-traveler cohorts (rail←grid, air←jet fuel)",
    farm:"rural farms with nitrogen-fertilizer demand via gas→Haber-Bosch→fertilizer market (cobweb-lagged)",

    climate_cell:"district climate-anomaly cells fed by the global climate system",
    psych:"the unconscious mind: habit inertia, loss aversion, status signaling, cognitive dissonance, social norms, present bias — per district",

  for(const [k] of order) h+=`<tr><td><b>${k}</b></td><td>${desc[k]||""}</td></tr>`;
  h+=`</table>`;
  t.innerHTML=h;
}

// ---------- timeline
{
  const t=$("#tab-timeline");
  let h=`<h2>Historical events (click for the model's replay)</h2><div class="timeline">`;
  const evs=[...D.events].sort((a,b)=>a.year-b.year);
  for(const e of evs){
    h+=`<div class="tl" onclick="showEvent('${e.id}');">
      <span class="yr">${e.year}</span> <b>${e.id.replaceAll("_"," ")}</b>
      <span class="k">${e.kilian}</span>
      <p>${e.desc}</p></div>`;
  }
  h+=`</div><div id="tl-detail"></div>`;
  t.innerHTML=h;
}
function showEvent(id){
  const e=D.events.find(x=>x.id===id);
  let h=`<div class="detail"><h2>${e.year} — ${e.id.replaceAll("_"," ")}</h2>
    <p class="legend">${fmt(e.touched)} nodes touched. Layer reach:</p><table>
    <tr><th>layer</th><th>touched</th><th>of</th><th>mean |stress|</th><th></th></tr>`;
  const maxm=Math.max(...Object.values(e.layers).map(l=>l.mean));
  for(const [k,l] of Object.entries(e.layers)){
    h+=`<tr><td>${k}</td><td>${fmt(l.touched)}</td><td>${fmt(l.n)}</td><td>${l.mean}</td>
      <td><div class="bar"><i style="width:${Math.min(100,100*l.mean/(maxm||1))}%"></i></div></td></tr>`;
  }
  h+=`</table>`;
  if(Object.keys(e.prices).length){
    h+=`<h2>Implied prices (calibrated units layer)</h2><table><tr><th>market</th><th>stress</th><th>price multiplier</th></tr>`;
    for(const [m,p] of Object.entries(e.prices))
      h+=`<tr><td>${m}</td><td class="${p.stress>0?'hot':'cool'}">${p.stress}</td><td>${p.mult?("×"+p.mult):"—"}</td></tr>`;
    h+=`</table>`;
  }
  h+=`<h2>Top propagated impacts</h2><table><tr><th>node</th><th>kind</th><th>impact</th><th>round</th></tr>`;
  for(const r of e.top.slice(0,20))
    h+=`<tr><td>${r.name}</td><td>${r.kind}</td><td class="${r.impact>0?'hot':'cool'}">${r.impact}</td><td>r${r.round}</td></tr>`;
  h+=`</table></div>`;
  document.getElementById("tl-detail").innerHTML=h;
  document.getElementById("tl-detail").scrollIntoView({behavior:"smooth"});
}

// ---------- events (validation)
{
  const t=$("#tab-events");
  let h=`<h2>Model vs history — price multipliers</h2>
  <p class="legend">Red rows are calibration anchors (fit by construction); the rest are out-of-sample replays. Factor-2 agreement is the design target.</p>
  <table><tr><th>event</th><th>year</th><th>market</th><th>observed ×</th><th>model ×</th><th>stress</th></tr>`;
  for(const r of D.validation){
    h+=`<tr style="${r.calibration_anchor?'color:#c44e52':''}"><td>${r.event}</td><td>${r.year}</td>
      <td>${r.market}</td><td>${r.observed_mult}</td><td>${r.model_mult??"—"}</td><td>${r.stress}</td></tr>`;
  }
  h+=`</table><h2>All replays</h2><div class="cards">`;
  for(const e of D.events)
    h+=`<div class="card" style="cursor:pointer" onclick="document.querySelectorAll('nav button')[1].click();showEvent('${e.id}')">
      <b>${fmt(e.touched)}</b><span>${e.year} ${e.id.replaceAll("_"," ")} — nodes touched</span></div>`;
  h+=`</div>`;
  t.innerHTML=h;
}

// ---------- nodes
{
  const t=$("#tab-nodes");
  let h=`<h2>Node explorer</h2>
  <p class="legend">A stratified sample of the ${fmt(D.meta.nodes)}-node web (${fmt(D.samples.length)} shown, ~220 per layer). Search names; filter by layer.</p>
  <input type="text" id="q" placeholder="search e.g. 'ERCOT 2019 ev', 'farm', 'dissonance', 'Comanche'">
  <select id="kf"><option value="">all layers</option>${Object.keys(D.census).map(k=>`<option>${k}</option>`).join("")}</select>
  <div id="nres"></div>`;
  t.innerHTML=h;
  const render=()=>{
    const q=$("#q").value.toLowerCase().split(/\s+/).filter(x=>x);
    const kf=$("#kf").value;
    const rows=D.samples.filter(s=>(!kf||s.kind===kf)&&q.every(w=>s.name.toLowerCase().includes(w))).slice(0,300);
    let h=`<table><tr><th>#</th><th>layer</th><th>node</th></tr>`;
    for(const s of rows) h+=`<tr><td>${s.i}</td><td>${s.kind}</td><td>${s.name}</td></tr>`;
    h+=`</table><small>${rows.length} shown</small>`;
    $("#nres").innerHTML=h;
  };
  $("#q").oninput=render; $("#kf").onchange=render; render();
}

// ---------- trends
{
  const t=$("#tab-trends");
  const T=D.trends, y=T.years;
  const series=[["ev_share_sales_pct","EV share of new sales % (Bass 1969)"],
    ["solar_cost_index","Solar cost index (Wright's law, 20%/doubling)"],
    ["battery_cost_index","Battery cost index (Wright, 18%)"],
    ["meat_kg_cap_emerging","Meat kg/capita, emerging economy (Engel saturation)"],
    ["datacenter_power_index","Datacenter power, 2010=100 (Koomey-flat → AI break)"],
    ["fleet_mpg_gasoline","Gasoline fleet mpg (model-year drift)"],
    ["global_primary_share_coal","Coal share of primary energy % (Marchetti wave)"],
    ["oil_substitution_transport","Oil share of transport % (Fisher-Pry substitution)"]];
  let h=`<h2>Encoded trend engines, 1965→2040</h2><p class="legend">These functions drive cohort forward projections; vertical line = 2026.</p>`;
  for(const [k,label] of series){
    const v=T[k], W=1100,H=130,mx=Math.max(...v),mn=Math.min(...v);
    const X=i=>40+(W-60)*i/(v.length-1), Y=val=>H-18-(H-38)*((val-mn)/((mx-mn)||1));
    let pts=v.map((val,i)=>`${X(i).toFixed(1)},${Y(val).toFixed(1)}`).join(" ");
    const nowX=X(y.indexOf(2026));
    h+=`<div class="detail"><b style="font-size:13px">${label}</b>
      <svg width="100%" viewBox="0 0 ${W} ${H}">
      <line x1="${nowX}" y1="12" x2="${nowX}" y2="${H-14}" stroke="#555" stroke-dasharray="3"/>
      <polyline points="${pts}" fill="none" stroke="#e8a33d" stroke-width="2.4"/>
      <text x="40" y="${H-2}">1965</text><text x="${W-70}" y="${H-2}">2040</text>
      <text x="2" y="16">${mx.toFixed(0)}</text><text x="2" y="${H-18}">${mn.toFixed(0)}</text>
      <text x="${nowX+4}" y="20">2026</text></svg></div>`;
  }
  t.innerHTML=h;
}

// ---------- climate
{
  const t=$("#tab-climate");
  const c=D.climate;
  let h=`<h2>Climate tab</h2><p class="legend">${c.note}. The climate system node forces district climate cells, which stress farms, households, and the macro weather systems (ENSO link).</p>
  <div class="cards">
    <div class="card"><b>${c.global_temp_stress}</b><span>global temperature node stress</span></div>
    <div class="card"><b>${fmt(c.cells_touched)}</b><span>district climate cells activated</span></div>
    <div class="card"><b>${fmt(c.farms_touched)}</b><span>farms stressed via climate path</span></div>
  </div><h2>Layer reach of the climate forcing run</h2><table>
  <tr><th>layer</th><th>touched</th><th>of</th><th>mean</th></tr>`;
  for(const [k,l] of Object.entries(c.layers))
    h+=`<tr><td>${k}</td><td>${fmt(l.touched)}</td><td>${fmt(l.n)}</td><td>${l.mean}</td></tr>`;
  h+=`</table><p class="legend">Kaya framing: district CO₂ = population × affluence × energy intensity × carbon intensity — the first two live in the household/diet cohorts, the last two in the fleet and grid layers.</p>`;
  t.innerHTML=h;
}

// ---------- mind
{
  const t=$("#tab-mind");
  let h=`<h2>The unconscious mind layer</h2>
  <p class="legend">Six psychological-substrate nodes per district (${fmt(D.census.psych)} total) modulate consumer behavior. See HISTORICAL_ALGORITHMS.md §4b for lineage.</p><table>
  <tr><th>node</th><th>mechanism</th><th>wiring in the web</th></tr>
  <tr><td><b>habit_inertia</b></td><td>Becker–Murphy habit formation; ~70% of energy use is habitual</td><td>damps consumer response (feeds consumers with stress-carrying inertia)</td></tr>
  <tr><td><b>loss_aversion</b></td><td>Kahneman–Tversky: price rises hurt ~2×</td><td>activated by fuel-cost shocks; over-drives conservation & hoarding</td></tr>
  <tr><td><b>status_signal</b></td><td>Veblen goods; identity-driven adoption</td><td>decouples EV/truck adoption from fuel-price math</td></tr>
  <tr><td><b>dissonance</b></td><td>Festinger: green identity vs high-carbon behavior accumulates tension</td><td>charged by oil stress × green density; discharges as oil-demand relief + EV pull (delayed, discontinuous change)</td></tr>
  <tr><td><b>social_norm</b></td><td>Cialdini/Opower: neighbor comparison ≈ 2% durable conservation</td><td>propagates conservation district-to-district; feeds dissonance</td></tr>
  <tr><td><b>present_bias</b></td><td>Laibson hyperbolic discounting; the efficiency gap</td><td>reinforces habit inertia; blocks long-run response</td></tr></table>
  <h2>Psych activation across historical events</h2><table><tr><th>event</th><th>psych nodes touched</th><th>mean |stress|</th></tr>`;
  for(const e of D.events){
    const p=e.layers.psych||{touched:0,mean:0};
    h+=`<tr><td>${e.year} ${e.id.replaceAll("_"," ")}</td><td>${fmt(p.touched)}</td><td>${p.mean}</td></tr>`;
  }
  h+=`</table><p class="legend">Read: sustained price events (1979, 2022) activate the dissonance/loss-aversion channel far more than brief spikes (1990) — the model's version of "crises change habits, blips don't."</p>`;
  t.innerHTML=h;
}
</script>
